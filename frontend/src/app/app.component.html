<header class="topbar">
  <div class="container topbar-inner">
    <a routerLink="/incidencias" class="brand">
      <span class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2 3 6v6c0 5 3.8 9.3 9 10 5.2-.7 9-5 9-10V6l-9-4Z" />
          <path d="M12 8v5" /><path d="M12 16h.01" />
        </svg>
      </span>
      <span class="brand-text">
        <strong>Soporte<em>VG</em></strong>
        <small>Centro de Incidencias</small>
      </span>
    </a>

    <span class="status" [class.local]="service.modo() === 'local'"
          [title]="service.modo() === 'api' ? 'Datos guardados en SQL Server' : 'API no disponible: datos en el navegador'">
      <i></i>
      {{ service.modo() === 'api' ? 'SQL Server conectado' : 'Modo local' }}
    </span>
  </div>
</header>

<main class="container page">
  <router-outlet />
</main>

<footer class="container footer">
  © {{ anio }} SoporteVG · Desarrollado por Jorge Vilcapuma · Angular + SQL Server
</footer>

<app-toast-container />
