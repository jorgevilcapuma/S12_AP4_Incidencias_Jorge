services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: incidencias-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Incidencias#2026"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - incidencias-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Incidencias#2026' -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: incidencias-db-init
    depends_on:
      sqlserver:
        condition: service_healthy
    volumes:
      - ./database/init.sql:/init.sql:ro
      - ./database/crud.sql:/crud.sql:ro
    entrypoint: ["/opt/mssql-tools18/bin/sqlcmd", "-S", "sqlserver", "-U", "sa", "-P", "Incidencias#2026", "-C", "-i", "/init.sql,/crud.sql"]
    restart: "no"

volumes:
  incidencias-data:
